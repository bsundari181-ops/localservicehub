```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | LocalServicesHub</title>

<style>

/* ================= GENERAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #1e293b;
}


/* ================= NAVBAR ================= */

.navbar {
    background: white;
    border-bottom: 1px solid #e5e7eb;
}

.nav-container {
    max-width: 1100px;
    margin: auto;
    padding: 16px 25px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #2563eb;
}

.logo span {
    color: #0f172a;
}


/* ================= CONTAINER ================= */

.container {
    max-width: 500px;
    margin: 45px auto;
    padding: 20px;
}


/* ================= SIGNUP CARD ================= */

.signup-card {
    background: white;

    padding: 35px;

    border-radius: 16px;

    border: 1px solid #e5e7eb;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}


/* ================= TITLE ================= */

.title {
    text-align: center;
    margin-bottom: 28px;
}

.title h1 {
    font-size: 30px;
    color: #0f172a;
    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}


/* ================= FORM ================= */

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;

    font-weight: bold;

    margin-bottom: 7px;

    color: #334155;
}

input,
select {

    width: 100%;

    padding: 12px;

    border: 1px solid #cbd5e1;

    border-radius: 7px;

    font-size: 15px;

    outline: none;
}

input:focus,
select:focus {

    border-color: #2563eb;

    box-shadow: 0 0 0 2px #dbeafe;
}


/* ================= SIGNUP BUTTON ================= */

.signup-btn {

    width: 100%;

    padding: 14px;

    background: #2563eb;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}

.signup-btn:hover {

    background: #1d4ed8;
}


/* ================= LOGIN ================= */

.login-link {

    text-align: center;

    margin-top: 20px;

    color: #64748b;
}

.login-link a {

    color: #2563eb;

    font-weight: bold;

    text-decoration: none;
}

.login-link a:hover {

    text-decoration: underline;
}


/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .container {
        margin: 25px auto;
        padding: 15px;
    }

    .signup-card {
        padding: 25px 18px;
    }

    .title h1 {
        font-size: 27px;
    }

}

</style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="nav-container">

        <div class="logo">
            Local<span>ServicesHub</span>
        </div>

    </div>

</header>



<!-- ================= SIGNUP ================= -->

<div class="container">

<div class="signup-card">


    <div class="title">

        <h1>
            📝 Create Account
        </h1>

        <p>
            Sign up to use LocalServicesHub
        </p>

    </div>



    <form id="signupForm">


        <!-- NAME -->

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>

        </div>



        <!-- MOBILE -->

        <div class="form-group">

            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter 10 digit mobile number"
                maxlength="10"
                pattern="[0-9]{10}"
                required>

        </div>



        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required>

        </div>



        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6"
                required>

        </div>



        <!-- USER TYPE -->

        <div class="form-group">

            <label>
                Account Type
            </label>

            <select id="accountType" required>

                <option value="">
                    Select account type
                </option>

                <option value="Customer">
                    Customer
                </option>

                <option value="Provider">
                    Service Provider
                </option>

            </select>

        </div>



        <!-- BUTTON -->

        <button
            type="submit"
            class="signup-btn">

            📝 Sign Up

        </button>


    </form>



    <!-- LOGIN -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


</div>

</div>



<!-- ================= JAVASCRIPT ================= -->

<script>

document
.getElementById("signupForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const name =
        document.getElementById("name").value;

    const phone =
        document.getElementById("phone").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const accountType =
        document.getElementById("accountType").value;


    // Check passwords

    if (password !== confirmPassword) {

        alert("Passwords do not match!");

        return;

    }


    try {
const response = await fetch(
    "https://localserviceshub-backend.onrender.com/signup",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,
                    phone: phone,
                    email: email,
                    password: password,
                    accountType: accountType

                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            // Directly go to Home

            window.location.href = "index.html";

        } else {

            alert(data.message);

        }


    } catch (error) {

        console.log(error);

        alert(
            "Cannot connect to server. Make sure Node.js backend is running."
        );

    }

});

</script>


</body>

</html>
