```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking | LocalServicesHub</title>

<style>

/* ================= GENERAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #1e293b;
}


/* ================= NAVBAR ================= */

.navbar {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.nav-container {
    max-width: 1100px;
    margin: auto;
    padding: 16px 25px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #2563eb;
}

.logo span {
    color: #0f172a;
}


/* ================= MAIN ================= */

.container {
    max-width: 650px;
    margin: 45px auto;
    padding: 20px;
}


/* ================= BOOKING CARD ================= */

.booking-card {
    background: white;

    padding: 35px;

    border-radius: 16px;

    border: 1px solid #e5e7eb;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}


/* ================= TITLE ================= */

.title {
    text-align: center;
    margin-bottom: 30px;
}

.title h1 {
    font-size: 32px;
    color: #0f172a;
    margin-bottom: 10px;
}

.title p {
    color: #64748b;
    font-size: 15px;
}


/* ================= FORM ================= */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    font-weight: bold;

    color: #334155;

    margin-bottom: 7px;
}


.form-group input,
.form-group select,
.form-group textarea {

    width: 100%;

    padding: 12px;

    border: 1px solid #cbd5e1;

    border-radius: 7px;

    font-size: 15px;

    outline: none;

    font-family: Arial, sans-serif;
}


.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {

    border-color: #2563eb;

    box-shadow: 0 0 0 2px #dbeafe;
}


.form-group textarea {
    resize: vertical;
}


/* ================= DATE & TIME ================= */

.date-time {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}


/* ================= CONFIRM BUTTON ================= */

.confirm-btn {

    width: 100%;

    padding: 14px;

    background: #2563eb;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}

.confirm-btn:hover {

    background: #1d4ed8;

}


/* ================= SUCCESS MESSAGE ================= */

.success-message {

    display: none;

    margin-top: 20px;

    padding: 20px;

    background: #dcfce7;

    border: 1px solid #86efac;

    color: #166534;

    border-radius: 10px;

    line-height: 1.8;

    text-align: center;
}


/* ================= BACK BUTTON ================= */

.back-btn {

    display: block;

    text-align: center;

    margin-top: 22px;

    color: #2563eb;

    font-weight: bold;

    text-decoration: none;
}

.back-btn:hover {

    text-decoration: underline;

}


/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .container {

        margin: 25px auto;

        padding: 15px;

    }

    .booking-card {

        padding: 25px 18px;

    }

    .title h1 {

        font-size: 27px;

    }

    .date-time {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="nav-container">

        <div class="logo">

            Local<span>ServicesHub</span>

        </div>

    </div>

</header>



<!-- ================= MAIN ================= -->

<div class="container">


<div class="booking-card">


    <!-- ================= TITLE ================= -->

    <div class="title">

        <h1>
            📅 Book a Service
        </h1>

        <p>
            Fill in your details to book a service.
        </p>

    </div>



    <!-- ================= BOOKING FORM ================= -->

    <form id="bookingForm">


        <!-- CUSTOMER NAME -->

        <div class="form-group">

            <label>
                Customer Name
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter your full name"
                required>

        </div>



        <!-- MOBILE NUMBER -->

        <div class="form-group">

            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter 10 digit mobile number"
                maxlength="10"
                pattern="[0-9]{10}"
                required>

        </div>



        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required>

        </div>



        <!-- SERVICE ADDRESS -->

        <div class="form-group">

            <label>
                Service Address
            </label>

            <textarea
                id="address"
                rows="4"
                placeholder="Enter your complete address"
                required></textarea>

        </div>



        <!-- BOOKING DATE -->

        <div class="date-time">


            <div class="form-group">

                <label>
                    Booking Date
                </label>

                <input
                    type="date"
                    id="bookingDate"
                    required>

            </div>



            <!-- BOOKING TIME -->

            <div class="form-group">

                <label>
                    Booking Time
                </label>

                <input
                    type="time"
                    id="bookingTime"
                    required>

            </div>


        </div>



        <!-- SERVICE TYPE -->

        <div class="form-group">

            <label>
                Service Type
            </label>

            <select
                id="serviceType"
                required>

                <option value="">
                    Select service type
                </option>

                <option value="Regular Service">
                    Regular Service
                </option>

                <option value="Emergency Service">
                    Emergency Service
                </option>

                <option value="Inspection">
                    Inspection
                </option>

            </select>

        </div>



        <!-- ADDITIONAL DETAILS -->

        <div class="form-group">

            <label>
                Additional Details
            </label>

            <textarea
                id="details"
                rows="4"
                placeholder="Describe your requirement or problem">
            </textarea>

        </div>



        <!-- CONFIRM BOOKING -->

        <button
            type="submit"
            class="confirm-btn">

            ✅ Confirm Booking

        </button>


    </form>



    <!-- ================= SUCCESS ================= -->

    <div
        id="successMessage"
        class="success-message">

        🎉 <strong>Booking Confirmed!</strong>

        <br><br>

        Your booking has been submitted successfully.

        <br>

        The service provider will contact you soon.

    </div>



    <!-- ================= BACK ================= -->

    <a
        href="index.html"
        class="back-btn">

        ← Back to Home

    </a>


</div>

</div>



<!-- ================= JAVASCRIPT ================= -->
<script>

/* ================= BOOKING DATE ================= */

const dateInput = document.getElementById("bookingDate");

const today = new Date().toISOString().split("T")[0];

dateInput.min = today;


/* ================= FORM SUBMIT ================= */

document.getElementById("bookingForm").addEventListener("submit", async function(event) {

    event.preventDefault();


    const customerName =
        document.getElementById("customerName").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const bookingDate =
        document.getElementById("bookingDate").value;

    const bookingTime =
        document.getElementById("bookingTime").value;

    const serviceType =
        document.getElementById("serviceType").value;

    const details =
        document.getElementById("details").value.trim();


    try {

        const response = await fetch(
            "http://localhost:5000/bookings",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    customerName: customerName,
                    phone: phone,
                    email: email,
                    address: address,
                    bookingDate: bookingDate,
                    bookingTime: bookingTime,
                    serviceType: serviceType,
                    details: details

                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            document.getElementById("bookingForm").style.display =
                "none";

            document.getElementById("successMessage").style.display =
                "block";

        } else {

            alert(data.message);

        }


    } catch (error) {

        console.log(error);

        alert(
            "Cannot connect to server. Make sure Node.js is running."
        );

    }

});

</script>

</body>

</html>
```
