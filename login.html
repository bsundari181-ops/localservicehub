```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | LocalServicesHub</title>

<style>

/* ================= GENERAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #1e293b;
}


/* ================= NAVBAR ================= */

.navbar {
    background: white;
    border-bottom: 1px solid #e5e7eb;
}

.nav-container {
    max-width: 1100px;
    margin: auto;
    padding: 16px 25px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #2563eb;
}

.logo span {
    color: #0f172a;
}


/* ================= CONTAINER ================= */

.container {
    max-width: 450px;
    margin: 60px auto;
    padding: 20px;
}


/* ================= LOGIN CARD ================= */

.login-card {
    background: white;

    padding: 35px;

    border-radius: 16px;

    border: 1px solid #e5e7eb;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}


/* ================= TITLE ================= */

.title {
    text-align: center;
    margin-bottom: 30px;
}

.title h1 {
    font-size: 30px;
    color: #0f172a;
    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}


/* ================= FORM ================= */

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;

    font-weight: bold;

    margin-bottom: 7px;

    color: #334155;
}

input {
    width: 100%;

    padding: 13px;

    border: 1px solid #cbd5e1;

    border-radius: 7px;

    font-size: 15px;

    outline: none;
}

input:focus {
    border-color: #2563eb;

    box-shadow: 0 0 0 2px #dbeafe;
}


/* ================= LOGIN BUTTON ================= */

.login-btn {

    width: 100%;

    padding: 14px;

    background: #2563eb;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.login-btn:hover {
    background: #1d4ed8;
}


/* ================= SIGNUP ================= */

.signup-link {

    text-align: center;

    margin-top: 22px;

    color: #64748b;
}

.signup-link a {

    color: #2563eb;

    font-weight: bold;

    text-decoration: none;
}

.signup-link a:hover {
    text-decoration: underline;
}


/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .container {
        margin: 30px auto;
        padding: 15px;
    }

    .login-card {
        padding: 25px 18px;
    }

    .title h1 {
        font-size: 27px;
    }

}

</style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="nav-container">

        <div class="logo">

            Local<span>ServicesHub</span>

        </div>

    </div>

</header>



<!-- ================= LOGIN ================= -->

<div class="container">

<div class="login-card">


    <!-- TITLE -->

    <div class="title">

        <h1>
            🔐 Login
        </h1>

        <p>
            Login to your LocalServicesHub account
        </p>

    </div>



    <!-- FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

        </div>



        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn">

            🔐 Login

        </button>


    </form>



    <!-- SIGN UP -->

    <div class="signup-link">

        Don't have an account?

        <a href="signup.html">
            Sign Up
        </a>

    </div>


</div>

</div>



<!-- ================= JAVASCRIPT ================= -->

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("http://localhost:5000/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if (response.ok) {

            // Login successful
localStorage.setItem("userEmail", email);
window.location.href = "index.html";
        } else {

            alert(data.message);

        }

    } catch (error) {

        console.log(error);

        alert("Cannot connect to server. Make sure Node.js is running.");

    }

});

</script>


</body>

</html>
