<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reviews & Ratings | LocalServicesHub</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #1e293b;
}

.navbar {
    background: white;
    border-bottom: 1px solid #e5e7eb;
}

.nav-container {
    max-width: 1100px;
    margin: auto;
    padding: 16px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #2563eb;
}

.logo span {
    color: #0f172a;
}

.home-btn {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.title {
    text-align: center;
    margin-bottom: 30px;
}

.title h1 {
    font-size: 32px;
    color: #0f172a;
    margin-bottom: 10px;
}

.title p {
    color: #64748b;
}

/* REVIEW FORM */

.review-card {
    background: white;
    padding: 30px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    margin-bottom: 35px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;

    border: 1px solid #cbd5e1;
    border-radius: 7px;

    font-size: 15px;
    outline: none;
}

textarea {
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #2563eb;
}

/* BUTTON */

.submit-btn {
    width: 100%;
    padding: 14px;

    background: #2563eb;
    color: white;

    border: none;
    border-radius: 8px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.submit-btn:hover {
    background: #1d4ed8;
}

/* REVIEWS */

.reviews-title {
    margin-bottom: 20px;
}

.review-item {
    background: white;

    padding: 25px;
    margin-bottom: 15px;

    border-radius: 12px;

    border: 1px solid #e5e7eb;
}

.review-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.stars {
    color: #f59e0b;
    font-size: 20px;
    margin-bottom: 10px;
}

.review-text {
    color: #475569;
    line-height: 1.6;
}

.review-date {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 10px;
}

.message {
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
}

@media (max-width: 600px) {

    .container {
        margin: 20px auto;
        padding: 15px;
    }

    .review-card {
        padding: 20px;
    }

    .title h1 {
        font-size: 27px;
    }

}

</style>

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <div class="logo">
            Local<span>ServicesHub</span>
        </div>

        <a href="index.html" class="home-btn">
            🏠 Home
        </a>

    </div>

</header>


<div class="container">

    <div class="title">

        <h1>⭐ Reviews & Ratings</h1>

        <p>
            Share your experience with our service providers.
        </p>

    </div>


    <!-- REVIEW FORM -->

    <div class="review-card">

        <form id="reviewForm">

            <div class="form-group">

                <label>
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Rating
                </label>

                <select id="rating" required>

                    <option value="">
                        Select rating
                    </option>

                    <option value="5">
                        ⭐⭐⭐⭐⭐ Excellent
                    </option>

                    <option value="4">
                        ⭐⭐⭐⭐ Very Good
                    </option>

                    <option value="3">
                        ⭐⭐⭐ Good
                    </option>

                    <option value="2">
                        ⭐⭐ Poor
                    </option>

                    <option value="1">
                        ⭐ Very Poor
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Your Review
                </label>

                <textarea
                    id="reviewText"
                    rows="5"
                    placeholder="Write your experience..."
                    required></textarea>

            </div>


            <div
                id="message"
                class="message">
            </div>


            <button
                type="submit"
                class="submit-btn">

                ⭐ Submit Review

            </button>

        </form>

    </div>


    <!-- REVIEWS LIST -->

    <h2 class="reviews-title">
        Customer Reviews
    </h2>

    <div id="reviewsContainer">

        <p>Loading reviews...</p>

    </div>

</div>


<script>

/* ================= LOAD EMAIL ================= */

const savedEmail =
    localStorage.getItem("userEmail");

if (savedEmail) {

    document.getElementById("email").value =
        savedEmail;

}


/* ================= SUBMIT REVIEW ================= */

document
.getElementById("reviewForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const customerName =
        document.getElementById("customerName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const rating =
        document.getElementById("rating").value;

    const reviewText =
        document.getElementById("reviewText").value.trim();


    try {

        const response = await fetch(
            "http://localhost:5000/reviews",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    customerName: customerName,
                    email: email,
                    rating: rating,
                    reviewText: reviewText

                })

            }
        );


        const data =
            await response.json();


        if (response.ok) {

            document.getElementById("message").innerHTML =
                "✅ Review submitted successfully!";

            document.getElementById("reviewForm").reset();

            if (savedEmail) {

                document.getElementById("email").value =
                    savedEmail;

            }

            loadReviews();

        } else {

            document.getElementById("message").innerHTML =
                "❌ " + data.message;

        }

    }

    catch (error) {

        console.log(error);

        document.getElementById("message").innerHTML =
            "❌ Cannot connect to server.";

    }

});


/* ================= LOAD REVIEWS ================= */

async function loadReviews() {

    const container =
        document.getElementById("reviewsContainer");

    try {

        const response =
            await fetch("http://localhost:5000/reviews");

        const reviews =
            await response.json();


        if (reviews.length === 0) {

            container.innerHTML =
                "<p>No reviews yet.</p>";

            return;

        }


        container.innerHTML = "";


        reviews.forEach(function(review) {

            let stars = "";

            for (
                let i = 1;
                i <= review.rating;
                i++
            ) {

                stars += "⭐";

            }


            container.innerHTML += `

                <div class="review-item">

                    <div class="review-name">
                        ${review.customer_name}
                    </div>

                    <div class="stars">
                        ${stars}
                    </div>

                    <div class="review-text">
                        ${review.review_text}
                    </div>

                    <div class="review-date">
                        ${new Date(review.created_at).toLocaleString()}
                    </div>

                </div>

            `;

        });

    }

    catch (error) {

        console.log(error);

        container.innerHTML =
            "<p>❌ Cannot load reviews.</p>";

    }

}


loadReviews();

</script>

</body>

</html>
